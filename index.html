<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book a free consultation with Zoha's Web Services. Fast, responsive form with validation.">
  <title>Book Free Consultation | Zoha Web Services</title>
  <style>
    body {font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5;}
    h1 {color: #333;}
    .form-group {margin-bottom: 15px;}
    label {display: block; margin-bottom: 5px; font-weight: bold;}
    input, select, textarea {width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 5px; font-size: 16px;}
    input:focus, select:focus, textarea:focus {outline: none; border-color: #4CAF50;}
    .error {border-color: #f44336 !important;}
    .error-message {color: #d32f2f; font-size: 14px; margin-top: 5px;}
    .success-message {background: #4CAF50; color: white; padding: 15px; border-radius: 5px; display: none;}
    button {background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;}
    button:disabled {background: #ccc;}
    #preview {max-width: 200px; margin-top: 10px; display: none;}
  </style>
</head>
<body>
  <h1>Book a Free Consultation</h1>
  
  <div class="success-message" id="success" role="alert">✅ Success! Your form was submitted.</div>
  
  <form id="contactForm" novalidate>
    <div class="form-group">
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" aria-required="true">
      <div class="error-message"></div>
    </div>
    
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" aria-required="true">
      <div class="error-message"></div>
    </div>
    
    <div class="form-group">
      <label for="phone">Phone *</label>
      <input type="tel" id="phone" name="phone" aria-required="true">
      <div class="error-message"></div>
    </div>
    
    <div class="form-group">
      <label for="date">Preferred Date *</label>
      <input type="date" id="date" name="date" aria-required="true">
      <div class="error-message"></div>
    </div>
    
    <div class="form-group">
      <label for="service">Service *</label>
      <select id="service" name="service" aria-required="true">
        <option value="">Select a service</option>
        <option value="web">Web Development</option>
        <option value="mobile">Mobile App</option>
        <option value="design">UI/UX Design</option>
      </select>
      <div class="error-message"></div>
    </div>
    
    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="4" aria-required="true"></textarea>
      <div class="error-message"></div>
    </div>
    
    <div class="form-group">
      <label for="file">Upload File</label>
      <input type="file" id="file" name="file" accept="image/*" aria-label="Upload an image file">
      <img id="preview" alt="Preview of uploaded file">
    </div>
    
    <div class="form-group">
      <input type="checkbox" id="terms" name="terms" aria-required="true">
      <label for="terms">I agree to terms *</label>
      <div class="error-message"></div>
    </div>
    
    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <script>
    const form = document.getElementById('contactForm');
    const fileInput = document.getElementById('file');
    const preview = document.getElementById('preview');
    
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });
    
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
      document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
      
      const name = document.getElementById('name');
      if (name.value.trim().length < 2) { name.classList.add('error'); name.nextElementSibling.textContent = 'Name must be 2+ characters'; valid = false; }
      
      const email = document.getElementById('email');
      if (!email.value.includes('@')) { email.classList.add('error'); email.nextElementSibling.textContent = 'Enter valid email'; valid = false; }
      
      const phone = document.getElementById('phone');
      if (phone.value.length < 10) { phone.classList.add('error'); phone.nextElementSibling.textContent = 'Phone must be 10+ digits'; valid = false; }
      
      if (valid) {
        document.getElementById('success').style.display = 'block';
        form.reset();
        preview.style.display = 'none';
      }
    });
  </script>
</body>
</html>
